<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Enhanced Futuristic Snake Engine</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <header>
            <div class="hud-item">
                <span class="label">SCORE</span>
                <span id="score" class="value">0000</span>
            </div>
            <div class="hud-title">SNAKE ENGINE 2.0</div>
            <div class="hud-item">
                <span class="label">HIGH SCORE</span>
                <span id="high-score" class="value">0000</span>
            </div>
        </header>

        <main>
            <canvas id="gameCanvas"></canvas>
            <div id="overlay" class="glass">
                <div id="menu">
                    <h1>SNAKE ENGINE</h1>
                    <p class="subtitle">AI-Enhanced Futuristic Edition</p>
                    <button id="start-btn" class="cyber-btn">INITIALIZE ENGINE</button>
                    <button id="ai-btn" class="cyber-btn secundary">AI AUTO-PLAY</button>
                    <div class="controls-hint">
                        <span>WSAD / ARROWS to navigate</span>
                        <span>ESC to pause</span>
                    </div>
                </div>
                <div id="game-over" class="hidden">
                    <h2 class="neon-text">SYSTEM FAILURE</h2>
                    <p>RECOVERY POSSIBLE</p>
                    <button id="restart-btn" class="cyber-btn">REBOOT</button>
                </div>
                <div id="pause-screen" class="hidden">
                    <h2 class="neon-text">PAUSED</h2>
                    <button id="resume-btn" class="cyber-btn">RESUME</button>
                </div>
            </div>
        </main>

        <footer>
            <div class="power-ups">
                <div id="pu-shield" class="pu inactive">SHIELD</div>
                <div id="pu-slow" class="pu inactive">SLOW</div>
                <div id="pu-double" class="pu inactive">2X</div>
            </div>
        </footer>
    </div>
    <script src="game.js"></script>
</body>
</html>
