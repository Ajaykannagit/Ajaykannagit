name: Generate Pac-Man Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate Pac-Man SVG
        run: node scripts/generate-pacman-svg.js Ajaykannagit dist/pacman.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SVG was generated
        run: |
          if [ -f dist/pacman.svg ]; then
            echo "✅ SVG generated successfully"
            head -5 dist/pacman.svg
          else
            echo "❌ SVG file not found"
            exit 1
          fi

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
