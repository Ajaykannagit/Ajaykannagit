        .scroll img {
          width: 50px;
          height: 50px;
          margin: 0 15px;
          filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.4));
        }
        @keyframes scroll {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
      </style>
